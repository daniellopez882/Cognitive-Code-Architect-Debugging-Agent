[project]
name = "codeguardian"
version = "1.0.0"
description = "Multi-agent code review and debugging assistant."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "venv", "__pycache__", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "S", "RUF"]
ignore = [
    "E501",
    "B008",
    # Console output uses box-drawing and symbol glyphs deliberately.
    "RUF001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"main.py" = ["E402"]      # sys.path insertion must precede the import
